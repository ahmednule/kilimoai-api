# Local Neo4j for development.
#   Start:  docker compose up -d
#   Stop:   docker compose down            (data is preserved)
#   Reset:  docker compose down -v         (deletes all data)
#
# The password here must match NEO4J_PASSWORD in your .env file.
services:
  neo4j:
    image: neo4j:5
    container_name: kilimo-neo4j
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt protocol (the app connects here)
    environment:
      - NEO4J_AUTH=neo4j/devpassword123
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p devpassword123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  neo4j-data:
